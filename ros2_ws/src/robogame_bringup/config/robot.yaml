robot_bridge:
  ros__parameters:
    command_timeout_s: 0.15
    # Provisional conservative variances; replace with field measurements.
    odom_pose_xy_variance: 0.25
    odom_pose_yaw_variance: 0.1219
    odom_twist_linear_variance: 0.04
    odom_twist_yaw_variance: 0.09
    imu_yaw_rate_variance: 0.09
    unavailable_variance: 1000000.0
    max_mcu_sample_gap_ms: 250

motion_controller:
  ros__parameters:
    kx: 1.2
    ky: 1.2
    kyaw: 1.8
    # 2026-08-18 电控确认：固件限幅建议 0.3/0.3/1.0，命令超限幅会触发
    # 协议故障锁存（非削顶），必须 PB2 重新授权。因此 motion_control 限速
    # 必须 ≤ 固件限幅，且 fake 模式同值（A0.7 假固件限幅拒绝同源）。
    max_vx: 0.30
    max_vy: 0.30
    max_wz: 1.00
    position_tolerance: 0.05
    yaw_tolerance: 0.0872665
    slow_radius: 0.35
    max_ax: 0.80
    max_ay: 0.80
    max_awz: 2.00
    max_control_dt_s: 0.10
    goal_timeout_s: 15.0
    pose_stale_s: 0.25
    status_stale_s: 0.30
    min_x: -0.2
    max_x: 7.4
    min_y: -0.2
    max_y: 5.0

cube_perception:
  ros__parameters:
    orange_hsv: [5, 100, 80, 25, 255, 255]
    purple_hsv: [125, 60, 50, 165, 255, 255]
    min_area_px: 400.0
    max_aspect_error: 0.8
    cube_size_m: 0.10
    fallback_focal_px: 700.0
    morph_kernel: 5
    min_confidence: 0.45
    confirm_frames: 3
    max_missed_frames: 3
    match_distance_px: 80.0
    smoothing_alpha: 0.4
    roi_x_min_ratio: 0.0
    roi_x_max_ratio: 1.0
    roi_y_min_ratio: 0.0
    roi_y_max_ratio: 1.0
    max_area_ratio: 0.35
    min_rectangularity: 0.35
    min_solidity: 0.50
    min_side_px: 12.0
    max_rotated_aspect_ratio: 3.2

manipulator_client:
  ros__parameters:
    target_distance_m: 0.24
    distance_tolerance_m: 0.025
    lateral_tolerance_m: 0.018
    kp_distance: 0.8
    kp_lateral: 1.2
    max_speed: 0.18
    target_stale_s: 0.5
    action_timeout_s: 12.0
    status_stale_s: 0.30
    placement_stable_duration_s: 3.0
    placement_observation_timeout_s: 6.0
    placement_max_unavailable_gap_s: 0.0
    place_heights_m: [0.10, 0.20, 0.30]

mission_manager:
  ros__parameters:
    orange_target: 2
    purple_target: 1
    max_retries: 2
    state_timeout_s: 20.0
    build_stability_s: 3.0
    orange_waypoint: [1.0, 0.5, 0.0]
    purple_waypoint: [1.5, 1.0, 0.0]
    build_waypoint: [0.5, 1.5, 1.5708]
    retreat_waypoint: [0.5, 1.2, 1.5708]


localization:
  ros__parameters:
    imu_stale_s: 0.2
    max_speed_mps: 3.0
    divergence_threshold: 0.5
