robot_bridge:
  ros__parameters:
    mock_mode: false
    serial_port: /dev/serial/by-id/usb-STMicroelectronics_STM32_Virtual_ComPort_307A39653433-if00
    baud_rate: 115200

manipulator_client:
  ros__parameters:
    runtime_mode: field
    placement_evidence_policy: unavailable

cube_perception:
  ros__parameters:
    # 工作分辨率 640x480（08-15 性能测试：1280x720 仅 ~13fps、CPU 270%）。
    # 焦距按分辨率线性缩放 2550 x (640/1280) = 1275；内参无需重标定
    # （fx≈2526.98, RMS 0.82px 依然有效，这是纯数学换算）。
    # 连带：min_area_px/min_side_px 为像素量纲，分辨率减半后需现场重调（B4）。
    fallback_focal_px: 1275.0

mission_manager:
  ros__parameters:
    # B2：真车走 B1 的全流程路线（启动区→巡线右转→上坡→取 3 块→下坡→搭建 2 层）。
    # 路线坐标来自 field_layout.yaml（现场实测），路径由 hardware.launch.py 传入；
    # 路线加载失败或自检不过 → 任务判失败并保持停车，绝不退回演示流程。
    route_enabled: true
    # 每段独立超时预算：坡道/巡线段较短，20s 足够；现场可按实测收紧。
    state_timeout_s: 20.0
    # B4：段失败重试耗尽后按降级阶梯继续（取块失败但有存货 → 去搭建；
    # 位置/朝向不可信 → 安全停车）。关掉就回到「一失败即判死」，便于现场对照排查。
    degrade_on_failure: true
    # B4：比赛总时长上限（秒）。规则 3.2.1：正式比赛 6 分钟，计时结束后动作无效；
    # 到点即安全停车并释放授权。
    match_time_limit_s: 360.0
    # B4：多趟循环。**保持 1**：真车单趟耗时未测，且「第二座建筑放哪里」
    # 与「机构层计数怎么复位」都还没有结论（见 docs/history 工作留痕 R9）。
    # 现场测出一趟耗时后，再按剩余时间决定要不要提到 2。
    rounds: 1

line_follow_controller:
  ros__parameters:
    # 比赛环境才打开授权门控：此时有任务层广播唯一授权（谁都不许抢 /cmd_vel）。
    # 独立巡线联调图刻意不启动任务层，所以那里必须内联覆盖回 false
    # （见 line_follow_hardware.launch.py 的内联参数与
    #  tests/test_launch_graph.py 的豁免测试）。
    require_authorization: true
    # B4：上电即自主的前提——启动时从这里加载落盘的黑白标定。
    # 路径必须与网页面板 `--calibration-file`（默认同值）一致；
    # 文件不存在/不合法时节点会大声报错并保持默认基准（车不会假装在巡线）。
    calibration_file: ~/robogame_line_calibration.json
