# ============================================================
# RoboGame 2026 场地图配置 —— 现场测量回填表
# ============================================================
# 【坐标系】（全文件统一，和 field_map.py / GENERAL_FIELD_MAP_2026.md 一致）
#   原点：场地外沿西南角（选一个固定的物理角，贴胶带标记）
#   +x  ：沿 4.8 m 短边
#   +y  ：沿 7.2 m 长边，指向对方半场
#   角度：弧度，逆时针为正；0 = 朝 +x 方向（90° = 朝 +y）
#   注意：x 是短边方向（全场最大 4.8），y 是长边方向（全场最大 7.2）。
# 【队伍】我方是红方，半场在西南角（启动区左下角 = (0.4, 0.4)）。
#   对方（蓝方）坐标 = (4.8 - x, 7.2 - y, yaw + pi)，角度归一化。
# 【单位】长度一律米；角度一律弧度（度数 × 3.14 ÷ 180）
# 【可信度标记】
#   rule      = 规则文字写死的值，不要改
#   estimated = 按规则推算的首版值，够规划用，不够厘米级定位
#   measured  = 你现场量出来的值，最终以它为准
# ============================================================

field:
  length_m: 7.2                  # [rule] 场地长边（沿 +y），不要改
  width_m: 4.8                   # [rule] 场地短边（沿 +x），不要改
  border_m: 0.4                  # [rule] 黑色边界宽/高，不要改
  line_width_m: 0.05             # [rule] 黑线宽，不要改
  line_width_tolerance: 0.05     # [rule] 规则允许 ±5% 误差
  symmetry: central              # [rule] 全场中心对称
  start_zone_m: [0.6, 0.6]       # [rule] 启动区尺寸（正方形，每半场一个），不要改
  build_zone_m: [2.4, 0.6]       # [rule] 搭建区 x方向(短边)2.4 x y方向(长边)0.6（每半场一个），不要改
  central_platform_m: [1.8, 1.7, 0.2]  # [rule] 中央高台 x方向(短边)1.8 x y方向(长边)1.7 x 高0.2（每半场一个，全场两个）
  ramp_m: [1.8, 0.8]             # [rule] 斜坡 x方向(短边)1.8 x y方向(长边)0.8（每半场一个；现场确认的方向）
  ramp_angle_deg: 14.0           # [rule] 斜坡角度（规则写"约 14°"）
  wall_material_zone_m: [1.8, 0.3]    # [rule] 墙体材料区尺寸 x方向(短边)1.8 x y方向(长边)0.3（红蓝各一，红 (2.6,4.7)、蓝 (0.4,2.2)，见 field_map.py）
  roof_material_zone_m: [2.2, 0.4]    # [rule] 屋顶材料区（全场一个）规则文字 2.2x0.4；实际方向 x=0.4/y=2.2（现场确认，见 field_map.py）

visual_tags:
  family: apriltag_36h11         # 【待现场确认】看标签实物是黑白方格码还是数字牌；
                                 #   若是数字牌，AprilTag 检测器不能直接用
  size_m: 0.15                   # [rule] 标签边长，不要改
  top_edge_height_m: 0.4         # [rule] 标签上沿离地高，不要改
  center_height_m: 0.325         # [rule] 中心高 = 0.4 - 0.15/2，不用测
  count_per_half: 6              # 现场确认：全场 12 个 = 每半场 6 个（编号 1-6，各半场一套）
  mounting: vertical_black_barrier_faces  # 现场确认：贴在黑色竖直挡板朝通道一面
  facing: robot_traffic_area              # 现场确认：标签正面朝向机器人通道
  coordinates: measured          # 填完下方 anchors 后保持 measured；未填时改成 unknown
  anchors:
    # x/y = 标签中心正下方地面点（你现场实测）；yaw = 正面朝向（弧度，逆时针为正）
    # yaw 对照：0=朝+x(短边) / 1.5708=朝+y(长边) / 3.1416=朝-x / 4.7124=朝-y
    # 朝向确认：1:+x  2:-y  3:+x  4:-y  5:-x  6:+y
    1: {x: 0.4, y: 1.6, yaw: 0.0}        # 1号：朝 +x（短边）
    2: {x: 1.5, y: 2.2, yaw: 4.7124}     # 2号：朝 -y（长边负向）
    3: {x: 2.6, y: 3.6, yaw: 0.0}        # 3号：朝 +x（短边）
    4: {x: 3.5, y: 4.7, yaw: 4.7124}     # 4号：朝 -y（长边负向）
    5: {x: 4.4, y: 1.6, yaw: 3.1416}     # 5号：朝 -x（短边负向）
    6: {x: 3.5, y: 0.4, yaw: 1.5708}     # 6号：朝 +y（长边）

# ============================================================
# 【现场测量存档】黑线拓扑（节点+边）/ 停车点 / 坡道边界
# 黑线是"图"不是"线"：节点=路口/拐角/终点，边=节点间的黑线段。
# 行驶顺序不固定（每轮任务先取橙块或先取紫块都行），所以不按顺序存，
# 而是存拓扑；任务管理器按需在图上选路径。
# 填法见每项注释。若某类没量，整段保留空即可。
# 所有 x 都是短边方向（0..4.8），所有 y 都是长边方向（0..7.2）。
# ============================================================
survey:
  line_nodes:                      # 黑线节点（路口/拐角/终点/辅助点），坐标 x短边/y长边
    # 类型: start(启动区出线) / junction(路口) / turn(拐角) / end(终点) / ramp_start / ramp_end
    N01: {type: start,     x: 0.7, y: 0.7, note: 启动区出线点}
    N02: {type: turn,      x: 0.7, y: 1.6, note: L1与主路汇交拐角}
    N03: {type: junction,  x: 1.5, y: 1.6, note: T形路口（主路+去N04支路）}
    N04: {type: end,       x: 1.5, y: 2.2, note: L3顶端}
    N05: {type: end,       x: 3.5, y: 1.0, note: L4底端}
    N06: {type: junction,  x: 3.5, y: 1.6, note: 主路与L4交叉}
    N07: {type: ramp_start, x: 3.5, y: 2.2, note: 上坡起点（辅助标定点）}
    N08: {type: ramp_end,  x: 3.5, y: 3.0, note: 上坡终点=高台起点（辅助标定点）}
    N09: {type: junction,  x: 3.5, y: 3.6, note: L4与L5 T形（高台上）}
    N10: {type: end,       x: 3.5, y: 4.7, note: 红方墙材区(W)终点}
    N11: {type: end,       x: 2.6, y: 3.6, note: 屋顶材料区(M)边界（L5左端）}
  line_edges:                      # 黑线段：连接两个节点
    # kind: LINE(普通巡线) / RAMP(上坡段)；via=中间经过的节点（线连续不断开）
    E01: {from: N01, to: N02, kind: LINE, note: L1 启动区出线（竖 x=0.7）}
    E02: {from: N02, to: N06, kind: LINE, via: [N03], note: 主路 y=1.6（连续）}
    E03: {from: N03, to: N04, kind: LINE, note: L3 支路（竖 x=1.5）}
    E04: {from: N05, to: N06, kind: LINE, note: L4 底段（y1.0->1.6）}
    E05: {from: N06, to: N07, kind: LINE, note: L4（y1.6->2.2）}
    E06: {from: N07, to: N08, kind: RAMP, note: 上坡段（y2.2->3.0，约14度）}
    E07: {from: N08, to: N09, kind: LINE, note: L4 高台上（y3.0->3.6）}
    E08: {from: N09, to: N10, kind: LINE, note: L4 到墙材区（y3.6->4.7）}
    E09: {from: N11, to: N09, kind: LINE, note: L5 高台上（y=3.6 横）}
  stops:                         # 停车点，按编号 W01, W02, ...
    # 每个点: 坐标 + 车头朝向(弧度,0=+x/90=+y/180=-x/270=-y) + 为什么停这里
    # 位置/朝向先按已确认数据推断（estimated），现场精修后覆盖。
    # 注意：搭建区是高 10cm 的平台，车不能上去，只能停北边(y=1.0)外侧面朝南放置。
    W01: {x: 0.7, y: 0.7, yaw: 1.5708, note: 启动姿态中心（朝主路+y方向）}
    W02: {x: 3.5, y: 4.7, yaw: 1.5708, note: 红方墙材区抓取位（N10，朝+y面朝墙材区）}
    W03: {x: 2.6, y: 3.6, yaw: 3.1416, note: 屋顶材料区抓取位（N11，朝-x面朝材料区）}
    W04: {x: 3.2, y: 1.1, yaw: 4.7124, note: 搭建放置位（平台北边外侧，朝-y面朝平台，车不上台）}
    W05: {x: 3.2, y: 1.6, yaw: 1.5708, note: 搭建后撤退位（放完朝+y退回主路）}
    W06: {x: 3.5, y: 2.2, yaw: 1.5708, note: 坡前等待位（N07上坡起点，减速）}
    W07: {x: 3.5, y: 3.0, yaw: 1.5708, note: 坡后恢复位（N08上坡终点/高台，恢复控制）}
    W08: {x: 1.5, y: 2.2, yaw: 1.5708, note: 蓝方墙材区抓取位（N04，朝+y面朝对方墙材区；规则更新：可抓对方方块）}
  ramp_edges:                    # 坡道起止线，编号 R01...R06
    # 示例:
    #   R01: {x: 1.6, y: 2.9, note: 坡道下沿左端}
    #   R02: {x: 1.6, y: 3.5, note: 坡道下沿右端}

# 灰度阈值 / 相机外参 / 传感器标定数据不要填在这个文件里：
#   灰度阈值     -> 巡线节点参数
#   相机外参     -> 相机到机器人坐标变换
#   停车误差     -> 到点容差、减速距离参数
#   详见 docs/field/场地布局与现场测量大白话指南_2026.md 第九节

state_policy:
  priority: [STOP, TAG_DOCK, RAMP, LINE_FOLLOW, WAYPOINT]
  stop_when: [emergency_stop, localization_invalid, communication_lost]
  tag_dock_when: [expected_tag_visible, tag_observation_valid]
  ramp_when: [pitch_threshold_crossed, ramp_region_entered]
  line_follow_when: [line_visible, route_segment_is_line_follow]
  waypoint_when: [localization_valid]
